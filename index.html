<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>모기 잡기 3D</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="style.css">
  <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
      }
    }
  </script>
</head>
<body>
  <!-- 3D 캔버스 뒤에 깔리는 유리창 배경 (배경 레퍼런스 참고). 캔버스가 투명해야 보인다. -->
  <div id="bg-window" aria-hidden="true">
    <div class="bg-sky"></div>
    <div class="bg-sea"></div>
    <svg class="bg-scenery" viewBox="0 0 300 375" preserveAspectRatio="xMidYMid slice">
      <g fill="#fff" opacity="0.85">
        <rect x="52" y="104" width="10" height="2" rx="1"/>
        <rect x="84" y="133" width="16" height="2" rx="1"/>
        <rect x="120" y="143" width="20" height="2" rx="1"/>
        <rect x="42" y="164" width="26" height="3" rx="1.5"/>
        <rect x="0" y="152" width="8" height="2" rx="1"/>
        <rect x="172" y="156" width="8" height="2" rx="1"/>
      </g>
      <g transform="translate(40 242)">
        <polygon points="18,0 18,28 4,28" fill="#fff"/>
        <polygon points="21,6 21,28 32,28" fill="#f2f6fb"/>
        <polygon points="0,31 36,31 31,36 6,36" fill="#fff"/>
      </g>
    </svg>
    <div class="bg-glass"></div>
    <div class="bg-frame"></div>
  </div>

  <canvas id="game-canvas"></canvas>

  <section id="screen-start" class="screen active">
    <h1>모기 잡기 3D</h1>
    <p>날아다니는 모기를 파리채로 잡고,<br>어떻게 처치할지 골라 보세요.</p>
    <button id="btn-start" type="button">시작</button>
  </section>

  <section id="screen-stage1" class="screen">
    <p class="hint">모기를 클릭해서 잡으세요! 원하는 만큼 잡은 뒤 '고문 시작'을 누르세요.</p>
    <div id="catch-hud">
      <span>잡은 모기 <strong id="catch-count">0</strong>마리</span>
      <button id="btn-torture" type="button" disabled>고문 시작</button>
    </div>
  </section>

  <section id="screen-stage2" class="screen">
    <p class="hint">잡았다! 처치 방법을 고르세요.</p>
  </section>

  <section id="screen-result" class="screen">
    <div id="result-mosquitoes" aria-label="죽은 모기"></div>
    <h1>결과</h1>
    <p>잡은 모기: <strong id="result-count">-</strong></p>
    <p>처치 방법: <strong id="result-method">-</strong></p>
    <button id="btn-retry" type="button">다시하기</button>
  </section>

  <script type="module" src="src/main.js"></script>
</body>
</html>
